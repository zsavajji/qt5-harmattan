#
# qmake configuration for the Nokia N9 / N950 (Harmattan PR1.3), built with the
# GCC 14 cross toolchain (scripts/build-toolchain.sh). Based on
# linux-arm-gnueabi-g++. Qt and apps live in /opt/qt5, next to the system Qt 4.
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

# modifications to g++.conf
QMAKE_CC                = arm-none-linux-gnueabi-gcc
QMAKE_CXX               = arm-none-linux-gnueabi-g++
QMAKE_LINK              = arm-none-linux-gnueabi-g++
QMAKE_LINK_SHLIB        = arm-none-linux-gnueabi-g++

# modifications to linux.conf
QMAKE_AR                = arm-none-linux-gnueabi-ar cqs
QMAKE_OBJCOPY           = arm-none-linux-gnueabi-objcopy
QMAKE_NM                = arm-none-linux-gnueabi-nm -P
QMAKE_STRIP             = arm-none-linux-gnueabi-strip

# OMAP3630: Cortex-A8 with NEON. Hard float, as the system libc (Tag_ABI_VFP_args).
# SUPPORT_X11: the SGX <EGL/eglplatform.h> uses the X11 native types (Display *, Window)
# only with it, and falls back to int / void * otherwise, which disables EGL on X11.
HARMATTAN_CFLAGS        = -march=armv7-a -mtune=cortex-a8 -mfpu=neon -mfloat-abi=hard -mthumb \
                          -DSUPPORT_X11
QMAKE_CFLAGS           += $$HARMATTAN_CFLAGS
QMAKE_CXXFLAGS         += $$HARMATTAN_CFLAGS

# DT_RPATH, not DT_RUNPATH: it covers libraries loaded by other libraries too, so our
# libstdc++, libgcc_s and libxcb in /opt/qt5/lib win over the system copies. With
# --sysroot, ld also searches <sysroot>/opt/qt5/lib for NEEDED entries through it.
QMAKE_LFLAGS           += -Wl,-rpath,/opt/qt5/lib -Wl,--disable-new-dtags
# Qt appends this after QMAKE_LFLAGS when the linker supports new dtags; keep it RPATH.
QMAKE_LFLAGS_NEW_DTAGS  = -Wl,--disable-new-dtags
# The rootfs has only /lib/ld-linux.so.3, not the armhf name GCC would pick.
QMAKE_LFLAGS_APP       += -Wl,--dynamic-linker,/lib/ld-linux.so.3

# The sysroot has headers and libraries for EGL and GLESv2 (SGX), but no .pc files.
QMAKE_LIBS_EGL          = -lEGL
QMAKE_LIBS_OPENGL_ES2   = -lGLESv2

load(qt_config)
